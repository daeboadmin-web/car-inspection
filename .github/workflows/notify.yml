# 업무차량 자동차검사 — 자동 메일 알림
#
# 매일 아침 8시(한국시간)에 검사 임박·기한초과 차량을 찾아 메일로 보냅니다.
# 보낼 차량이 없으면 메일을 보내지 않습니다.
#
# 파일 위치(중요): .github/workflows/notify.yml
# 이 파일 하나만 올리면 됩니다. 다른 파일은 필요 없습니다.
#
# 필요한 Secrets — 저장소 Settings → Secrets and variables → Actions
#   SMTP_HOST  SMTP_PORT  SMTP_USER  SMTP_PASS  MAIL_FROM  MAIL_TO

name: 차량검사 메일 알림

on:
  schedule:
    # 23:05 UTC = 다음날 08:05 (한국시간)
    - cron: '5 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제로 보내지 않고 대상만 확인'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 검사 대상 확인 후 메일 발송
        env:
          # 차량 목록 — index.html 에 들어 있는 값과 같습니다 (공개용 키)
          SUPABASE_URL: https://tgrspiwnuxhmkstaukjf.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRncnNwaXdudXhobWtzdGF1a2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTUxMzgsImV4cCI6MjEwMjYzMTEzOH0.Vv3oUYOTdAApDtacnXvu2d2QBsSrkkrrZqZul_suQfw
          SITE_URL: https://daeboadmin-web.github.io/car-inspection/

          # 메일 설정 — 값은 Secrets 에 넣어두세요 (여기에 직접 쓰지 마세요)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}

          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

        run: |
          python3 - <<'PYEOF'
          import os, sys, ssl, json, smtplib, urllib.request, urllib.parse
          from datetime import datetime, timedelta, timezone
          from email.message import EmailMessage
          from email.utils import formataddr, formatdate

          KST = timezone(timedelta(hours=9))

          # ── 언제 알릴지 ────────────────────────────────────────────────
          # 만료까지 남은 일수가 이 값과 정확히 같은 날 알립니다.
          ALERT_DAYS = [30, 14, 7, 3, 1, 0]
          # 기한이 지난 차량은 매일 알립니다.
          ALERT_OVERDUE_DAILY = True
          # 월요일에는 30일 이내 차량 전체를 한 번 더 정리해 보냅니다.
          WEEKLY_DIGEST_WEEKDAY = 0          # 0=월요일, None 이면 사용 안 함
          CONTACT = "영남사업단 김동욱 과장 · 010-3455-8203"


          def env(name, default=None, required=False):
              v = os.environ.get(name, default)
              if required and not v:
                  sys.exit(f"[설정 오류] 환경변수 {name} 가 비어 있습니다.")
              return v


          def fetch_vehicles(url, key):
              q = f"{url.rstrip('/')}/rest/v1/vehicles?select=*&order=due_date.asc"
              req = urllib.request.Request(q, headers={
                  "apikey": key,
                  **({"Authorization": f"Bearer {key}"} if key.startswith("eyJ") else {}),
                  "Accept": "application/json",
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))


          def parse_date(s):
              try:
                  return datetime.strptime(str(s)[:10], "%Y-%m-%d").date()
              except Exception:
                  return None


          def classify(vehicles, today, weekday):
              """알릴 차량만 골라 (긴급도, 남은일수) 순으로 돌려줍니다."""
              picked, seen = [], set()

              def add(v, d):
                  if v.get("id") in seen:
                      return
                  seen.add(v.get("id"))
                  picked.append((d, v))

              weekly = WEEKLY_DIGEST_WEEKDAY is not None and weekday == WEEKLY_DIGEST_WEEKDAY

              for v in vehicles:
                  due = parse_date(v.get("due_date"))
                  if not due:
                      continue
                  d = (due - today).days
                  if d < 0 and ALERT_OVERDUE_DAILY:
                      add(v, d)
                  elif d in ALERT_DAYS:
                      add(v, d)
                  elif weekly and 0 <= d <= 30:
                      add(v, d)

              picked.sort(key=lambda x: x[0])
              return picked


          def fmt(due):
              w = "월화수목금토일"[due.weekday()]
              return f"{due.year}. {due.month:02d}. {due.day:02d} ({w})"


          def build_html(rows, today, site):
              def esc(t):
                  return (str(t or "").replace("&", "&amp;").replace("<", "&lt;")
                          .replace(">", "&gt;").replace('"', "&quot;"))

              over = [r for r in rows if r[0] < 0]
              soon = [r for r in rows if r[0] >= 0]

              items = []
              for d, v in rows:
                  due = parse_date(v.get("due_date"))
                  if d < 0:
                      color, badge, note = "#E02D3C", f"D+{abs(d)}", "기한 초과 · 과태료 대상"
                  elif d <= 7:
                      color, badge, note = "#C2610A", ("D-DAY" if d == 0 else f"D-{d}"), "검사 임박"
                  else:
                      color, badge, note = "#1B64DA", f"D-{d}", "검사 예정"

                  win_a, win_b = due - timedelta(days=31), due + timedelta(days=31)
                  items.append(f"""
                  <tr>
                    <td style="padding:16px 18px;border-bottom:1px solid #F0F2F4;">
                      <div style="font-size:16px;font-weight:700;color:#191F28;">
                        {esc(v.get('plate') or '번호 미입력')}
                        <span style="font-size:13px;font-weight:500;color:#8B95A1;">&nbsp;{esc(v.get('name'))}</span>
                      </div>
                      <div style="font-size:13px;color:#8B95A1;margin-top:5px;">
                        {esc(v.get('kind') or '정기검사')} · 만료 {fmt(due)}
                      </div>
                      <div style="font-size:12px;color:#333D4B;margin-top:4px;">
                        검사 가능 {win_a.strftime('%Y.%m.%d')} ~ {win_b.strftime('%Y.%m.%d')}
                      </div>
                      {f'<div style="font-size:12px;color:#8B95A1;margin-top:4px;">{esc(v.get("memo"))}</div>' if v.get('memo') else ''}
                    </td>
                    <td style="padding:16px 18px;border-bottom:1px solid #F0F2F4;text-align:right;white-space:nowrap;vertical-align:top;">
                      <div style="font-size:17px;font-weight:700;color:{color};">{badge}</div>
                      <div style="font-size:11px;color:#8B95A1;margin-top:3px;">{note}</div>
                    </td>
                  </tr>""")

              head = []
              if over:
                  head.append(f'<b style="color:#E02D3C;">기한 초과 {len(over)}대</b>')
              if soon:
                  head.append(f'<b style="color:#C2610A;">검사 임박 {len(soon)}대</b>')
              summary = " · ".join(head)

              return f"""<!DOCTYPE html><html lang="ko"><body style="margin:0;padding:24px 12px;background:#F2F4F6;
           font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
          <div style="max-width:600px;margin:0 auto;">
            <div style="padding:0 4px 14px;">
              <div style="font-size:18px;font-weight:700;color:#191F28;letter-spacing:-.5px;">업무차량 자동차검사 알림</div>
              <div style="font-size:13px;color:#8B95A1;margin-top:5px;">{today.year}년 {today.month}월 {today.day}일 · {summary}</div>
            </div>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="background:#fff;border-radius:16px;border-collapse:separate;overflow:hidden;">
              {''.join(items)}
            </table>

            <div style="background:#fff;border-radius:16px;margin-top:12px;padding:16px 18px;
                        font-size:12.5px;color:#333D4B;line-height:1.8;">
              검사는 유효기간 <b>만료일 전후 31일 이내</b>에 받아야 과태료가 없습니다.<br>
              검사를 마치신 뒤에는 아래 화면에서 <b>만료일을 갱신</b>해 주세요.
            </div>

            <div style="text-align:center;margin:18px 0 8px;">
              <a href="{site}" style="display:inline-block;background:#1B64DA;color:#fff;text-decoration:none;
                 font-size:14px;font-weight:700;padding:13px 26px;border-radius:10px;">차량 목록 열기</a>
            </div>

            <div style="text-align:center;font-size:11.5px;color:#8B95A1;line-height:1.8;padding:10px 0 0;">
              문의 · {CONTACT}<br>
              이 메일은 검사 임박·초과 차량이 있을 때만 자동 발송됩니다.
            </div>
          </div></body></html>"""


          def build_text(rows):
              lines = []
              for d, v in rows:
                  due = parse_date(v.get("due_date"))
                  tag = f"D+{abs(d)} 기한초과" if d < 0 else ("D-DAY" if d == 0 else f"D-{d}")
                  lines.append(f"[{tag}] {v.get('plate') or '번호미입력'} {v.get('name') or ''} "
                               f"- {v.get('kind') or '정기검사'} 만료 {fmt(due)}")
              return "업무차량 자동차검사 알림\n\n" + "\n".join(lines) + f"\n\n문의 · {CONTACT}"


          def main():
              dry = env("DRY_RUN") == "1"
              now = datetime.now(KST)
              today = now.date()

              vehicles = fetch_vehicles(env("SUPABASE_URL", required=True),
                                        env("SUPABASE_KEY", required=True))
              print(f"차량 {len(vehicles)}대 조회 · 기준일 {today}")

              rows = classify(vehicles, today, now.weekday())
              if not rows:
                  print("알릴 차량이 없습니다. 메일을 보내지 않습니다.")
                  return

              for d, v in rows:
                  print(f"  대상: {v.get('plate')} {v.get('name')} D{d:+d}")

              site = env("SITE_URL", "https://daeboadmin-web.github.io/car-inspection/")
              over = sum(1 for d, _ in rows if d < 0)
              subj = f"[차량검사] 확인 필요 {len(rows)}대" + (f" · 기한초과 {over}대" if over else "")

              msg = EmailMessage()
              msg["Subject"] = subj
              msg["From"] = formataddr(("업무차량 검사알림", env("MAIL_FROM", required=True)))
              msg["To"] = env("MAIL_TO", required=True)
              msg["Date"] = formatdate(localtime=True)
              msg.set_content(build_text(rows))
              msg.add_alternative(build_html(rows, today, site), subtype="html")

              if dry:
                  print("\n--- DRY RUN · 실제로 보내지 않았습니다 ---")
                  print("제목:", subj)
                  print("받는사람:", msg["To"])
                  open("preview.html", "w", encoding="utf-8").write(build_html(rows, today, site))
                  print("미리보기 저장: preview.html")
                  return

              host = env("SMTP_HOST", required=True)
              port = int(env("SMTP_PORT", "587"))
              user = env("SMTP_USER", required=True)
              pw = env("SMTP_PASS", required=True)

              ctx = ssl.create_default_context()
              if port == 465:
                  with smtplib.SMTP_SSL(host, port, context=ctx, timeout=30) as sv:
                      sv.login(user, pw)
                      sv.send_message(msg)
              else:
                  with smtplib.SMTP(host, port, timeout=30) as sv:
                      sv.ehlo()
                      try:
                          sv.starttls(context=ctx)
                          sv.ehlo()
                      except smtplib.SMTPNotSupportedError:
                          print("주의: 이 서버는 STARTTLS 를 지원하지 않아 평문으로 보냅니다.")
                      sv.login(user, pw)
                      sv.send_message(msg)

              print(f"발송 완료 → {msg['To']}")


          if __name__ == "__main__":
              main()
          PYEOF
